apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels: {team: payments-risk}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-scoring
  namespace: payments
  labels: {app: fraud-scoring, team: payments-risk}
spec:
  replicas: 2
  selector:
    matchLabels: {app: fraud-scoring}
  template:
    metadata:
      labels: {app: fraud-scoring, team: payments-risk}
    spec:
      containers:
        - name: fraud-scoring
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-scoring
  namespace: payments
  labels: {app: fraud-scoring, team: payments-risk}
spec:
  selector: {app: fraud-scoring}
  ports:
    - port: 80
      targetPort: 8080
