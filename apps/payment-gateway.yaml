apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels: {team: payments-core}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: payments
  labels: {app: payment-gateway, team: payments-core}
spec:
  replicas: 2
  selector:
    matchLabels: {app: payment-gateway}
  template:
    metadata:
      labels: {app: payment-gateway, team: payments-core}
    spec:
      containers:
        - name: payment-gateway
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway
  namespace: payments
  labels: {app: payment-gateway, team: payments-core}
spec:
  selector: {app: payment-gateway}
  ports:
    - port: 80
      targetPort: 8080
