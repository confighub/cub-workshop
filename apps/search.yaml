apiVersion: v1
kind: Namespace
metadata:
  name: retail
  labels: {team: retail-web}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: retail
  labels: {app: search, team: retail-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: search}
  template:
    metadata:
      labels: {app: search, team: retail-web}
    spec:
      containers:
        - name: search
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: retail
  labels: {app: search, team: retail-web}
spec:
  selector: {app: search}
  ports:
    - port: 80
      targetPort: 8080
