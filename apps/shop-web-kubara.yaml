apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  namespace: shop
spec:
  replicas: 3
  selector: { matchLabels: { app: shop-web } }
  template:
    metadata: { labels: { app: shop-web } }
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: shop-web
  namespace: shop
spec:
  selector: { app: shop-web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-web
  namespace: shop
spec:
  ingressClassName: traefik
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: shop-web, port: { number: 80 } } }
  tls:
    - hosts: [shop.example.com]
      secretName: shop-web-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop-web-tls
  namespace: shop
spec:
  secretName: shop-web-tls
  issuerRef: { name: letsencrypt, kind: ClusterIssuer }
  dnsNames: [shop.example.com]
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shop-web-db
  namespace: shop
spec:
  refreshInterval: 1h
  secretStoreRef: { name: platform-store, kind: ClusterSecretStore }
  target: { name: shop-web-db }
  data:
    - secretKey: password
      remoteRef: { key: shop/db, property: password }
