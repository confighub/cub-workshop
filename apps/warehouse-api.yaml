apiVersion: v1
kind: Namespace
metadata:
  name: logistics
  labels: {team: logistics-eng}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-api
  namespace: logistics
  labels: {app: warehouse-api, team: logistics-eng}
spec:
  replicas: 2
  selector:
    matchLabels: {app: warehouse-api}
  template:
    metadata:
      labels: {app: warehouse-api, team: logistics-eng}
    spec:
      containers:
        - name: warehouse-api
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-api
  namespace: logistics
  labels: {app: warehouse-api, team: logistics-eng}
spec:
  selector: {app: warehouse-api}
  ports:
    - port: 80
      targetPort: 8080
