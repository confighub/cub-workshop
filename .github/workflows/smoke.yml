name: smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: nouns and verbs, offline lanes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.11
          cache-dependency-path: plugin-host/go.sum
      - name: test the SDK plugin host
        run: go test ./...
        working-directory: plugin-host
      # Every test file runs here except the two that pull bundle-form stacks from
      # public registries; those run in the bundles job. A new tests/*.test.mjs is
      # picked up without editing this file.
      - name: every offline test file
        run: |
          files=$(ls tests/*.test.mjs | grep -v -e stack-workspace.test.mjs -e kubara-gitops.test.mjs)
          echo "$files"
          node --test $files
      - name: config lists and checks a shipped render
        run: |
          node bin/cub-config list
          node bin/cub-config check redis
          node bin/cub-config check kube-prometheus-stack
      - name: app checks both teaching apps and exports Score
        run: |
          node bin/cub-app list
          node bin/cub-app check hello-standalone
          node bin/cub-app check shop-web
          node bin/cub-app score shop-web
      # Stacks whose components are authored files or bundles seeded in cache/ resolve
      # with no registry. eks-inference, kubara-* and kubara-gitops-shop pull from
      # public registries and are sandboxed in the bundles job.
      - name: stack certifies every stack that resolves offline
        run: |
          node bin/cub-stack list
          for stack in web-tiny web-platform observability-base redis-platform data-services gitops-secrets app-platform; do
            node bin/cub-stack sandbox "$stack"
          done
          node bin/cub-stack sandbox shop-platform --out /tmp/shop-platform.yaml
          test -s /tmp/shop-platform.yaml
      - name: a manifest anywhere on disk resolves the shipped sources
        run: |
          cp stacks/web-tiny.yaml /tmp/my-stack.yaml
          node bin/cub-stack check /tmp/my-stack.yaml
      - name: check refuses both known conflicts
        run: |
          for broken in metrics-double conflict-demo; do
            if node bin/cub-stack check "$broken"; then
              echo "$broken certified but must be refused" && exit 1
            else
              echo "$broken refused as designed"
            fi
          done
      # cub kubara render renders the platform; here a fake cub writes the golden
      # render kubara-confighub publishes, so this lane needs no cub and no helm.
      - name: from-kubara builds one stack from cub kubara render that checks, per cluster too
        run: |
          rm -rf /tmp/kubara-out
          node tests/kubara-fake-cub.mjs /tmp/fake-cub
          PATH=/tmp/fake-cub:$PATH node bin/cub-stack from-kubara tests/fixtures/kubara-platform --out /tmp/kubara-out
          node bin/cub-stack check /tmp/kubara-out/stack.yaml
          node bin/cub-stack check /tmp/kubara-out/stack.yaml --cluster spoke
      - name: upload plans the ConfigHub writes and makes none
        run: node bin/cub-stack upload web-tiny
      - name: config diff names one changed field between two files
        run: |
          sed 's/"v1"/"v2"/' components/frontend-config.yaml > /tmp/frontend-config-v2.yaml
          node bin/cub-config diff components/frontend-config.yaml /tmp/frontend-config-v2.yaml | tee /tmp/config-diff.txt
          grep -q '1 changed' /tmp/config-diff.txt
      - name: config values checks a values file against a real chart
        run: |
          printf 'replicaCount: 3\nmetrics:\n  enabled: true\n' > /tmp/smoke-values.yaml
          node bin/cub-config values tests/fixtures/values-chart -f /tmp/smoke-values.yaml --max-renders 5 --exit-code
      - name: fleet lists and plans the shipped manifest
        run: |
          node bin/cub-fleet list
          node bin/cub-fleet plan meridian

  oci:
    name: certified bundles round-trip through a registry
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports: ["5001:5000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3
      - name: push a config as a certified bundle and verify it from its digest
        run: |
          out=$(node bin/cub-config check redis --out oci://localhost:5001/workshop/redis:ci)
          echo "$out"
          digest=$(echo "$out" | grep -oE 'oci://[^ ]+@sha256:[0-9a-f]{64}' | head -1)
          node bin/cub-config verify "$digest"
          printf 'apiVersion: helm-expt.confighub.com/v1alpha1\nkind: Stack\nmetadata:\n  name: from-registry\nspec:\n  description: "a bundle whose receipt lives in the registry"\n  components:\n    - name: redis\n      bundle: "%s"\n' "$digest" > /tmp/from-registry.yaml
          node bin/cub-stack check /tmp/from-registry.yaml
      - name: publish a stack as a flattened release and as an index
        run: |
          node bin/cub-stack sandbox shop-platform --out oci://localhost:5001/workshop/shop-platform:release
          node bin/cub-stack publish shop-platform --out oci://localhost:5001/workshop/shop-platform:index
      - name: an index is consumable by digest, and a key signs and verifies
        run: |
          index=$(node bin/cub-stack publish web-tiny --out oci://localhost:5001/workshop/web-tiny:idx | grep -oE 'oci://[^ ]+@sha256:[0-9a-f]{64}' | tail -1)
          node bin/cub-stack check "$index"
          mkdir -p /tmp/keys && (cd /tmp/keys && COSIGN_PASSWORD="" cosign generate-key-pair)
          signed=$(node bin/cub-config check redis --out oci://localhost:5001/workshop/signed:ci --sign /tmp/keys/cosign.key | grep -oE 'oci://[^ ]+@sha256:[0-9a-f]{64}' | head -1)
          node bin/cub-config verify "$signed" --key /tmp/keys/cosign.pub
      - name: a digest without a receipt is refused
        run: |
          echo plain > /tmp/plain.txt
          digest=$(cd /tmp && oras push localhost:5001/workshop/plain:ci plain.txt --plain-http | grep -oE 'sha256:[0-9a-f]{64}' | tail -1)
          if node bin/cub-config verify "oci://localhost:5001/workshop/plain@$digest"; then echo "verified a bundle with no receipt" && exit 1; else echo "refused as designed"; fi
      - name: a from-kubara platform publishes as one index
        run: |
          if [ -f tests/kubara-publish.test.mjs ]; then
            CUB_TEST_REGISTRY=localhost:5001 node --test tests/kubara-publish.test.mjs
          fi

  bundles:
    name: bundle-form stacks, pulled by digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oras-project/setup-oras@v1
      - name: sandbox the bundle-form platforms from public registries
        run: |
          node bin/cub-stack sandbox eks-inference
          node bin/cub-stack sandbox kubara-platform
          node bin/cub-stack sandbox kubara-shop-platform
          if node bin/cub-stack check kubara-shop-first-try; then exit 1; fi

      - name: saved workspace survives handoff and a local edit
        run: node --test tests/stack-workspace.test.mjs
      - name: Kubara GitOps selection retains the existing app
        run: node --test tests/kubara-gitops.test.mjs
