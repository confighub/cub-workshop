apiVersion: helm-expt.confighub.com/v1alpha1
kind: Stack
metadata:
  name: gitops-secrets
spec:
  description: "A delivery control plane: Argo CD, External Secrets, and cert-manager, three CRD-shipping components composed together."
  components:
    - name: cert-manager
      render: "renders/cert-manager.yaml"
    - name: external-secrets
      render: "renders/external-secrets.yaml"
    - name: argo-cd
      render: "renders/argo-cd.yaml"
