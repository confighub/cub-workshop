apiVersion: helm-expt.confighub.com/v1alpha1
kind: Stack
metadata:
  name: eks-inference
spec:
  description: "The EKS inference platform as a stack: eight digest-pinned certified bundles across three planes. The keystone, spoken in the settled vocabulary."
  components:
    - name: platform-profile
      plane: hub
      order: 0
      bundle: "oci://ghcr.io/confighub/configs/eks-inference/platform-profile@sha256:af2a1d3dd9c74839c22121dcda1ac38c6600d67dd927a7a42280464a375acfcd"
      receipt: receipts/eks-inference/platform-profile.yaml
    - name: ack-controllers
      plane: mgmt
      order: 0
      bundle: "oci://ghcr.io/confighub/configs/eks-inference/ack-controllers@sha256:7f318e6448a35ac89cc465e476f9c73dcbde73dc213b7e13746ac01864a67566"
      receipt: receipts/eks-inference/ack-controllers.yaml
    - name: aws-network
      plane: mgmt
      order: 1
      bundle: "oci://ghcr.io/confighub/configs/eks-inference/aws-network@sha256:b71b990fe90bbe8fc32855d2eeae379711f826247851a6c1450cd32fbcc2f903"
      receipt: receipts/eks-inference/aws-network.yaml
    - name: eks-cluster
      plane: mgmt
      order: 2
      bundle: "oci://ghcr.io/confighub/configs/eks-inference/eks-cluster@sha256:cc6ae42f8347d5e06d7ad787f5582d96a3005c55674cc52c8c2a2d849917899f"
      receipt: receipts/eks-inference/eks-cluster.yaml
    - name: karpenter-aws
      plane: mgmt
      order: 3
      bundle: "oci://ghcr.io/confighub/configs/eks-inference/karpenter-aws@sha256:535376df49b0fe8f11f0cda012fb5399a7c70f59f4932335faee92a3cf0ad194"
      receipt: receipts/eks-inference/karpenter-aws.yaml
    - name: karpenter
      plane: workload
      order: 0
      bundle: "oci://ghcr.io/confighub/configs/eks-inference/karpenter@sha256:d182fce8c942d0a40497b1d13ec067e4707c0c31027fc049d256afab01b1814e"
      receipt: receipts/eks-inference/karpenter.yaml
    - name: gpu-runtime
      plane: workload
      order: 1
      bundle: "oci://ghcr.io/confighub/configs/eks-inference/gpu-runtime@sha256:588aa8431fa26fe41e8bc3eaac1bc156e7be6749577ef484fffcf6e953215e16"
      receipt: receipts/eks-inference/gpu-runtime.yaml
    - name: inference-workloads
      plane: workload
      order: 2
      bundle: "oci://ghcr.io/confighub/configs/eks-inference/inference-workloads@sha256:4ae5737725c86f7a07cf3366a7eafee8625a0dd8487784aa581ce7e33d460eb2"
      receipt: receipts/eks-inference/inference-workloads.yaml
  # The shared-value bindings: which profile field feeds which downstream path,
  # derived from the producer's link declarations at commit f6a1689c2fe2 and kept
  # here so the manifest is the single source the drivers read. path is
  # normalized; pathEscaped keeps the escaping cub link create requires.
  bindings:
    pathBindings:
      - component: "karpenter"
        unit: "nodeclasses"
        field: "networkName"
        resourceType: "karpenter.k8s.aws/v1/EC2NodeClass"
        resourceName: "/general"
        path: "spec.subnetSelectorTerms.0.tags.karpenter.sh/discovery"
        pathEscaped: "spec.subnetSelectorTerms.0.tags.karpenter~1sh/discovery"
        upstream: "spec.networkName"
      - component: "karpenter"
        unit: "nodeclasses"
        field: "networkName"
        resourceType: "karpenter.k8s.aws/v1/EC2NodeClass"
        resourceName: "/general"
        path: "spec.securityGroupSelectorTerms.0.tags.karpenter.sh/discovery"
        pathEscaped: "spec.securityGroupSelectorTerms.0.tags.karpenter~1sh/discovery"
        upstream: "spec.networkName"
      - component: "karpenter"
        unit: "nodeclasses"
        field: "networkName"
        resourceType: "karpenter.k8s.aws/v1/EC2NodeClass"
        resourceName: "/gpu"
        path: "spec.subnetSelectorTerms.0.tags.karpenter.sh/discovery"
        pathEscaped: "spec.subnetSelectorTerms.0.tags.karpenter~1sh/discovery"
        upstream: "spec.networkName"
      - component: "karpenter"
        unit: "nodeclasses"
        field: "networkName"
        resourceType: "karpenter.k8s.aws/v1/EC2NodeClass"
        resourceName: "/gpu"
        path: "spec.securityGroupSelectorTerms.0.tags.karpenter.sh/discovery"
        pathEscaped: "spec.securityGroupSelectorTerms.0.tags.karpenter~1sh/discovery"
        upstream: "spec.networkName"
      - component: "karpenter"
        unit: "nodeclasses"
        field: "nodeRoleName"
        resourceType: "karpenter.k8s.aws/v1/EC2NodeClass"
        resourceName: "/general"
        path: "spec.role"
        pathEscaped: "spec.role"
        upstream: "spec.nodeRoleName"
      - component: "karpenter"
        unit: "nodeclasses"
        field: "nodeRoleName"
        resourceType: "karpenter.k8s.aws/v1/EC2NodeClass"
        resourceName: "/gpu"
        path: "spec.role"
        pathEscaped: "spec.role"
        upstream: "spec.nodeRoleName"
      - component: "karpenter"
        unit: "nodeclasses"
        field: "gpuAMIAlias"
        resourceType: "karpenter.k8s.aws/v1/EC2NodeClass"
        resourceName: "/gpu"
        path: "spec.amiSelectorTerms.0.alias"
        pathEscaped: "spec.amiSelectorTerms.0.alias"
        upstream: "spec.gpuAMIAlias"
      - component: "eks-cluster"
        unit: "cluster"
        field: "clusterName"
        resourceType: "eks.services.k8s.aws/v1alpha1/Cluster"
        resourceName: "aws-inference/inference-demo"
        path: "spec.name"
        pathEscaped: "spec.name"
        upstream: "spec.clusterName"
      - component: "eks-cluster"
        unit: "nodegroup"
        field: "nodeRoleName"
        resourceType: "eks.services.k8s.aws/v1alpha1/Nodegroup"
        resourceName: "aws-inference/inference-demo-system"
        path: "spec.nodeRoleRef.from.name"
        pathEscaped: "spec.nodeRoleRef.from.name"
        upstream: "spec.nodeRoleName"
      - component: "aws-network"
        unit: "network"
        field: "az0"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-private-a"
        path: "spec.availabilityZone"
        pathEscaped: "spec.availabilityZone"
        upstream: "spec.availabilityZones.0"
      - component: "aws-network"
        unit: "network"
        field: "az1"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-private-b"
        path: "spec.availabilityZone"
        pathEscaped: "spec.availabilityZone"
        upstream: "spec.availabilityZones.1"
      - component: "aws-network"
        unit: "network"
        field: "az2"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-private-c"
        path: "spec.availabilityZone"
        pathEscaped: "spec.availabilityZone"
        upstream: "spec.availabilityZones.2"
      - component: "aws-network"
        unit: "network"
        field: "az0"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-public-a"
        path: "spec.availabilityZone"
        pathEscaped: "spec.availabilityZone"
        upstream: "spec.availabilityZones.0"
      - component: "aws-network"
        unit: "network"
        field: "az1"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-public-b"
        path: "spec.availabilityZone"
        pathEscaped: "spec.availabilityZone"
        upstream: "spec.availabilityZones.1"
      - component: "aws-network"
        unit: "network"
        field: "az2"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-public-c"
        path: "spec.availabilityZone"
        pathEscaped: "spec.availabilityZone"
        upstream: "spec.availabilityZones.2"
      - component: "aws-network"
        unit: "network"
        field: "vpcCIDR"
        resourceType: "ec2.services.k8s.aws/v1alpha1/VPC"
        resourceName: "aws-inference/inference-demo-vpc"
        path: "spec.cidrBlocks.0"
        pathEscaped: "spec.cidrBlocks.0"
        upstream: "spec.vpcCIDR"
      - component: "aws-network"
        unit: "network"
        field: "vpcCIDR"
        resourceType: "ec2.services.k8s.aws/v1alpha1/SecurityGroup"
        resourceName: "aws-inference/inference-demo-cluster-sg"
        path: "spec.ingressRules.0.ipRanges.0.cidrIP"
        pathEscaped: "spec.ingressRules.0.ipRanges.0.cidrIP"
        upstream: "spec.vpcCIDR"
      - component: "aws-network"
        unit: "network"
        field: "pubCIDR0"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-public-a"
        path: "spec.cidrBlock"
        pathEscaped: "spec.cidrBlock"
        upstream: "spec.publicSubnetCIDRs.0"
      - component: "aws-network"
        unit: "network"
        field: "pubCIDR1"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-public-b"
        path: "spec.cidrBlock"
        pathEscaped: "spec.cidrBlock"
        upstream: "spec.publicSubnetCIDRs.1"
      - component: "aws-network"
        unit: "network"
        field: "pubCIDR2"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-public-c"
        path: "spec.cidrBlock"
        pathEscaped: "spec.cidrBlock"
        upstream: "spec.publicSubnetCIDRs.2"
      - component: "aws-network"
        unit: "network"
        field: "privCIDR0"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-private-a"
        path: "spec.cidrBlock"
        pathEscaped: "spec.cidrBlock"
        upstream: "spec.privateSubnetCIDRs.0"
      - component: "aws-network"
        unit: "network"
        field: "privCIDR1"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-private-b"
        path: "spec.cidrBlock"
        pathEscaped: "spec.cidrBlock"
        upstream: "spec.privateSubnetCIDRs.1"
      - component: "aws-network"
        unit: "network"
        field: "privCIDR2"
        resourceType: "ec2.services.k8s.aws/v1alpha1/Subnet"
        resourceName: "aws-inference/inference-demo-private-c"
        path: "spec.cidrBlock"
        pathEscaped: "spec.cidrBlock"
        upstream: "spec.privateSubnetCIDRs.2"
    envBindings:
      - component: "ack-controllers"
        unit: "ec2-controller"
        field: "region"
        container: "controller"
        envVar: "AWS_REGION"
      - component: "ack-controllers"
        unit: "iam-controller"
        field: "region"
        container: "controller"
        envVar: "AWS_REGION"
      - component: "ack-controllers"
        unit: "eks-controller"
        field: "region"
        container: "controller"
        envVar: "AWS_REGION"
      - component: "karpenter"
        unit: "karpenter-controller"
        field: "region"
        container: "controller"
        envVar: "AWS_REGION"
