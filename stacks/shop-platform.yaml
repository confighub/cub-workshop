apiVersion: helm-expt.confighub.com/v1alpha1
kind: Stack
metadata:
  name: shop-platform
spec:
  description: "A web platform with monitoring and a message queue, with the shop app running on it: ingress, certificates, the Prometheus stack, RabbitMQ, and shop-web."
  components:
    - name: cert-manager
      plane: mgmt
      order: 1
      bundle: "oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/bundles/workshop-cert-manager@sha256:4bd8b82b898da503a774d47348532d85a18910ca635ae2f772354777636ca134"
      receipt: "receipts/workshop/cert-manager.json"
    - name: ingress-nginx
      plane: mgmt
      order: 2
      bundle: "oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/bundles/workshop-ingress-nginx@sha256:a35e80f1f8333716d6867128391ccfc777a72240c63bb920106be47f5a76d8f2"
      receipt: "receipts/workshop/ingress-nginx.json"
    - name: kube-prometheus-stack
      plane: mgmt
      order: 3
      bundle: "oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/bundles/workshop-kube-prometheus-stack@sha256:1c485c529c60588924e11a6e3f27ff8899802045672c1f80aa26a049e49d6a6a"
      receipt: "receipts/workshop/kube-prometheus-stack.json"
    - name: rabbitmq
      plane: workload
      order: 1
      bundle: "oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/bundles/workshop-rabbitmq@sha256:d94f26b2a0cbf1b02966855ff1f7c61742c7b54d599f2fa99539ccc97ac94e01"
      receipt: "receipts/workshop/rabbitmq.json"
    - name: shop-web
      plane: workload
      order: 2
      authored: "apps/shop-web.yaml"
