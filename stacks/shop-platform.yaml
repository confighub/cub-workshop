apiVersion: helm-expt.confighub.com/v1alpha1
kind: Stack
metadata:
  name: shop-platform
spec:
  description: "A web platform with monitoring and a message queue, with the shop app running on it: ingress, certificates, the Prometheus stack, RabbitMQ, and shop-web."
  components:
    - name: cert-manager
      plane: mgmt
      order: 1
      bundle: "oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/bundles/workshop-cert-manager@sha256:76314143ef5017951d1351732eb0796707e73797c2a67ace5fb4202a62bbad70"
      receipt: "receipts/workshop/cert-manager.json"
    - name: ingress-nginx
      plane: mgmt
      order: 2
      bundle: "oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/bundles/workshop-ingress-nginx@sha256:e0e01c0e758fc117bb6b6391d2268b9be1182d1cf3fdcc4aaaaa8564c2fea5f2"
      receipt: "receipts/workshop/ingress-nginx.json"
    - name: kube-prometheus-stack
      plane: mgmt
      order: 3
      bundle: "oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/bundles/workshop-kube-prometheus-stack@sha256:d46ddb13b9453b54f0125035a435349b0053dde7dd945ac63249f1834eafbac2"
      receipt: "receipts/workshop/kube-prometheus-stack.json"
    - name: rabbitmq
      plane: workload
      order: 1
      bundle: "oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/bundles/workshop-rabbitmq@sha256:0433facdcf8d0c65506849bf02a40534ff07be69fd3d72c44de8e887a7d52dcb"
      receipt: "receipts/workshop/rabbitmq.json"
    - name: shop-web
      plane: workload
      order: 2
      authored: "apps/shop-web.yaml"
